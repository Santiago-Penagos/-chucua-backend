[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chucua-backend"
version = "0.1.0"
description = "Dominio, persistencia y semilla del proyecto Chucua de la Vaca"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["chucua_backend*", "seed*"]

[tool.setuptools.package-data]
seed = ["datos/*.geojson"]

[tool.pytest.ini_options]
testpaths = ["tests", "../chucua-api/tests"]
pythonpath = ["src", "."]
addopts = "-q"
